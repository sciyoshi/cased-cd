name: CI

on:
  push:
    branches: [ main, feature/*, fix/*, security/* ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-typecheck:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

      - name: Run TypeScript type check
        run: pnpm type-check

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test:run

  argocd-integration-tests:
    name: Real Argo CD Integration Tests
    runs-on: ubuntu-24.04
    env:
      ARGOCD_VERSION: v3.4.5
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create ephemeral Kubernetes cluster
        uses: nolar/setup-k3d-k3s@v1
        with:
          version: v1.35
          k3d-tag: v5.9.0
          k3d-name: cased-cd-integration

      - name: Install and seed Argo CD fixture
        run: |
          kubectl create namespace argocd
          kubectl apply -n argocd --server-side --force-conflicts \
            -f "https://raw.githubusercontent.com/argoproj/argo-cd/${ARGOCD_VERSION}/manifests/install.yaml"
          kubectl patch configmap argocd-cmd-params-cm -n argocd --type merge \
            -p '{"data":{"server.insecure":"true"}}'
          kubectl rollout restart deployment/argocd-server -n argocd
          kubectl wait --for=condition=Available deployment --all -n argocd --timeout=5m
          kubectl rollout status statefulset/argocd-application-controller \
            -n argocd --timeout=5m
          kubectl apply -f - <<'EOF'
          apiVersion: argoproj.io/v1alpha1
          kind: Application
          metadata:
            name: guestbook
            namespace: argocd
          spec:
            project: default
            source:
              repoURL: https://github.com/argoproj/argocd-example-apps.git
              targetRevision: HEAD
              path: guestbook
            destination:
              server: https://kubernetes.default.svc
              namespace: default
          EOF

      - name: Authenticate and run required real-Argo tests
        env:
          ARGOCD_API_URL: http://127.0.0.1:8090/api/v1
          ARGOCD_INTEGRATION_REQUIRED: 'true'
          ARGOCD_TEST_APPLICATION: guestbook
        run: |
          kubectl port-forward -n argocd svc/argocd-server 8090:80 \
            > /tmp/argocd-port-forward.log 2>&1 &
          port_forward_pid=$!
          trap 'kill "$port_forward_pid"' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8090/healthz > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              cat /tmp/argocd-port-forward.log
              exit 1
            fi
            sleep 2
          done
          password="$(kubectl get secret argocd-initial-admin-secret -n argocd \
            -o jsonpath='{.data.password}' | base64 --decode)"
          credentials="$(jq --null-input --compact-output \
            --arg password "$password" '{username:"admin", password:$password}')"
          token="$(curl --fail --silent --show-error \
            -H 'Content-Type: application/json' \
            --data "$credentials" \
            http://127.0.0.1:8090/api/v1/session | jq --exit-status --raw-output '.token')"
          echo "::add-mask::$token"
          export ARGOCD_AUTH_TOKEN="$token"
          pnpm test:integration:argocd

  nginx-config-tests:
    name: nginx Configuration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install nginx
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx

      - name: Run nginx configuration tests
        env:
          REQUIRE_NGINX_SYNTAX: 'true'
        run: ./docker/test-entrypoint.sh

  helm-chart-tests:
    name: Helm Chart Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Run Helm chart tests
        run: ./chart/test-chart.sh

  docker-build-tests:
    name: Docker Build Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build standard image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: standard
          push: false
          tags: cased-cd-test:standard
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Docker integration tests
        run: ./docker/test-build.sh

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Check build output
        run: |
          if [ ! -d "dist" ]; then
            echo "Build output directory 'dist' not found"
            exit 1
          fi
          if [ ! -f "dist/index.html" ]; then
            echo "index.html not found in build output"
            exit 1
          fi
          echo "✓ Build output validated"

  all-tests-passed:
    name: All Tests Passed
    runs-on: ubuntu-latest
    needs:
      - lint-and-typecheck
      - unit-tests
      - argocd-integration-tests
      - nginx-config-tests
      - helm-chart-tests
      - docker-build-tests
      - build-frontend
    steps:
      - name: All tests passed
        run: echo "✅ All CI tests passed successfully!"
