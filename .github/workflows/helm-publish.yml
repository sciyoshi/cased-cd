name: Publish Helm Chart

on:
  push:
    branches:
      - main
    paths:
      - 'chart/**'
      - '.github/workflows/helm-publish.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Package Helm chart
        run: |
          helm package chart/ --destination .deploy

      - name: Update Helm repository
        run: |
          HELM_REPOSITORY=/tmp/cased-cd-helm-repository
          if git ls-remote --exit-code --heads origin gh-pages; then
            git fetch origin gh-pages:refs/remotes/origin/gh-pages
            git worktree add --detach "$HELM_REPOSITORY" origin/gh-pages
          else
            git worktree add --detach "$HELM_REPOSITORY"
            git -C "$HELM_REPOSITORY" switch --orphan gh-pages
          fi

          cp .deploy/*.tgz "$HELM_REPOSITORY/"
          if [ -f "$HELM_REPOSITORY/index.yaml" ]; then
            helm repo index "$HELM_REPOSITORY" \
              --url https://raw.githubusercontent.com/sciyoshi/cased-cd/gh-pages \
              --merge "$HELM_REPOSITORY/index.yaml"
          else
            helm repo index "$HELM_REPOSITORY" \
              --url https://raw.githubusercontent.com/sciyoshi/cased-cd/gh-pages
          fi

          git -C "$HELM_REPOSITORY" config user.name "$GITHUB_ACTOR"
          git -C "$HELM_REPOSITORY" config user.email "$GITHUB_ACTOR@users.noreply.github.com"
          git -C "$HELM_REPOSITORY" add '*.tgz' index.yaml
          if git -C "$HELM_REPOSITORY" diff --cached --quiet; then
            echo "Helm repository is already up to date"
          else
            git -C "$HELM_REPOSITORY" commit -m "Update Helm chart repository (from $GITHUB_SHA)"
            git -C "$HELM_REPOSITORY" push origin HEAD:gh-pages
          fi

      - name: Summary
        run: |
          {
            echo "### Helm Chart Published :rocket:"
            echo ""
            echo "Chart repository: https://raw.githubusercontent.com/sciyoshi/cased-cd/gh-pages"
            echo ""
            printf '%s\n' '```bash'
            echo "helm repo add cased https://raw.githubusercontent.com/sciyoshi/cased-cd/gh-pages"
            echo "helm repo update"
            echo "helm install cased-cd cased/cased-cd"
            printf '%s\n' '```'
          } >> "$GITHUB_STEP_SUMMARY"
