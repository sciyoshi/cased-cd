apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cased-cd.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cased-cd.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "cased-cd.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "cased-cd.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "cased-cd.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "cased-cd.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/entrypoint.sh"]
          env:
            - name: ARGOCD_SERVER
              value: {{ .Values.argocd.server | quote }}
            - name: ARGOCD_INSECURE
              value: {{ .Values.argocd.insecure | quote }}
            {{- with .Values.argocd.tls.serverName }}
            - name: ARGOCD_TLS_SERVER_NAME
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.argocd.tls.caSecret.name }}
            - name: ARGOCD_CA_CERT_PATH
              value: /etc/cased-cd/argocd-tls/ca.crt
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- with .Values.argocd.tls.caSecret.name }}
          volumeMounts:
            - name: argocd-ca
              mountPath: /etc/cased-cd/argocd-tls
              readOnly: true
          {{- end }}
      {{- with .Values.argocd.tls.caSecret.name }}
      volumes:
        - name: argocd-ca
          secret:
            secretName: {{ . | quote }}
            items:
              - key: {{ $.Values.argocd.tls.caSecret.key | quote }}
                path: ca.crt
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
# Rebuild trigger - namespace fix
