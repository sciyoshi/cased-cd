# Default values for cased-cd
# This is a YAML-formatted file.

# Number of replicas
replicaCount: 1

image:
  # Docker image repository
  repository: ghcr.io/sciyoshi/cased-cd
  # Image pull policy
  pullPolicy: IfNotPresent
  # Overrides the image tag (defaults to chart appVersion)
  tag: ""

# Image pull secrets
imagePullSecrets: []

# Override the chart name
nameOverride: ""
# Override the full name
fullnameOverride: ""

# ArgoCD server configuration
argocd:
  # URL of the ArgoCD server API
  # Default assumes ArgoCD is installed in the 'argocd' namespace
  # Uses HTTPS (ArgoCD's default) and verifies the upstream certificate.
  server: "https://argocd-server.argocd.svc.cluster.local"
  # Disable certificate-chain and hostname verification. Prefer configuring a
  # trusted CA below for private or self-signed certificates.
  insecure: false
  tls:
    # Override the name used for SNI and certificate hostname verification.
    # By default, the hostname is derived from argocd.server.
    serverName: ""
    caSecret:
      # Existing Secret containing the CA certificate used to verify Argo CD.
      # Leave empty to use the image's system trust store.
      name: ""
      key: "ca.crt"

service:
  # Service type (ClusterIP, NodePort, LoadBalancer)
  type: ClusterIP
  # Service port
  port: 80
  # Target port on the container
  targetPort: 8080
  # Annotations to add to the service
  annotations: {}

ingress:
  # Enable ingress
  enabled: false
  # Specific implementation for ingress controller. One of `generic` or `tailscale`
  controller: generic
  # Ingress class name
  className: ""
  # Ingress annotations
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  # Ingress hosts
  hosts:
    - host: cased-cd.example.com
      paths:
        - path: /
          pathType: Prefix
  # TLS configuration
  tls: []
  #  - secretName: cased-cd-tls
  #    hosts:
  #      - cased-cd.example.com
  tailscale:
    # Desired host name of the Tailscale node
    hostname: "cased-cd"
    # Optional Tailscale HA proxy group, e.g. "ingress-proxies"
    proxyGroup: ""

# Resource limits and requests
resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity rules
affinity: {}

# Pod annotations
podAnnotations: {}

# Pod security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101  # nginx user
  fsGroup: 101
  seccompProfile:
    type: RuntimeDefault

# Container security context
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
  seccompProfile:
    type: RuntimeDefault

# Liveness probe
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 3
  successThreshold: 1
  failureThreshold: 3

# Readiness probe
readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  successThreshold: 1
  failureThreshold: 3

# Service account
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# Horizontal Pod Autoscaler
autoscaling:
  # Create an autoscaling/v2 HPA and let it control Deployment replicas.
  # Requires the Kubernetes resource metrics API and matching resource requests.
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  # Set either target to null to omit that metric; at least one is required.
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# NetworkPolicy
networkPolicy:
  # Create a NetworkPolicy selecting the Cased CD pods. It allows inbound TCP
  # traffic only to the named HTTP container port. It does not select the pods
  # for egress; account for Argo CD, DNS, and SSO in separately managed policies.
  enabled: false
